name: Verify public source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run Python unit tests
        run: |
          python -m unittest discover -s . -t . -p 'test_*.py'
          python mobile/test_android_features.py
      - name: Confirm the oversized contextual model is not tracked
        run: test ! -e mobile/android/assets/context-encoder-int8.onnx
