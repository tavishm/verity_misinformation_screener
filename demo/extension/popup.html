<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence Check</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/icon48.png" alt="" width="36" height="36"><div><h1>Evidence Check</h1><p class="eyebrow">A little context for your feed.</p></div><span class="pill">BETA</span></header>
<section class="connection"><span id="dot" class="dot"></span><div><strong id="status" role="status" aria-live="polite">Checking connection…</strong><p id="source-count" class="small">Local inference · no paid API</p></div><button id="connect" class="primary" type="button">Connect</button></section>
<p id="notice" class="notice" role="status" hidden></p>
<label class="switch-row" for="auto"><span><strong>Check as I scroll</strong><span class="small block">Visible public posts on X &amp; Reddit</span></span><input id="auto" type="checkbox" role="switch"></label>
<label class="switch-row" for="capture"><span><strong>Record feed exposure</strong><span class="small block">Send each visible post version once to the local demo dashboard</span></span><input id="capture" type="checkbox" role="switch"></label>
<div class="settings"><label for="mode">Automatically check</label><select id="mode"><option value="all">All visible posts</option><option value="popular">Popular posts only</option></select><label for="limit">New checks per day</label><select id="limit"><option value="20">20</option><option value="50">50</option><option value="100">100</option><option value="200">200</option></select></div>
<p id="remaining" class="small"></p><p id="mode-hint" class="small"></p>
<div class="scope-card"><strong>Evidence for the text.</strong><p>Check text below a post to see its rating and source passages. Images and videos need a separate review.</p></div>
<footer><button id="open" type="button">Open checker ↗</button><button id="dashboard" type="button">Dashboard ↗</button><button id="settings" type="button">Setup &amp; details</button><button id="refresh" type="button" aria-label="Refresh connection status">↻</button></footer>
<script src="popup.js"></script></body></html>
